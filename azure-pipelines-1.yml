trigger: none


pool:
 name: App_Agent
 demands: Agent.Name -equals App_Agent_Server
  

stages:
  - stage: ci
    jobs:
      - job: linting_checking
        steps:
        - task: PowerShell@2
          displayName: stylelint_checking
          continueOnError: true
          inputs:
            targetType: 'inline'
            script: |
              npm install -g stylelint stylelint-config-standard
              npx stylelint "src/main/webapp/**/*.css" --config "stylelint.config.mjs"

        - task: CmdLine@2
          displayName: biome linting
          inputs:
            script: |
              npm install -g @biomejs/biome
              biome lint "/src/main/webaps.**/*.css --reporter=junit > biomeresult.xml
            workingDirectory: '$(System.DefaultWorkingDirectory)'

        - task: PublishTestResults@2
          displayName: test result
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: 'biomeresult.xml'
            testRunTitle: 'biome test'