trigger: none


pool:
 name: App_Agent
 demands: Agent.Name -equals App_Agent_Server
  

stages:
  - stage: ci
    jobs:
      - job: linting_checking
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              npm install -g stylelint-config-standard
              npx stylelint "src/main/webapp/**/*.css" --config "stylelint.config.mjs"
            workingDirectory: '$(System.DefaultWorkingDirectory)/JavaLoginPracticeApp'